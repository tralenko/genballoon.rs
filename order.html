<!DOCTYPE html>
<html lang="sr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Porudžbina</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="styles/general.css">
<link rel="stylesheet" href="styles/header.css">
<link rel="stylesheet" href="styles/order.css">


<script src="js/cart.js" defer></script>
<script src="js/order.js" defer></script>


</head>


<body>


<header class="header">

<div class="logo">
    <div class="logo-txt">
        <p><span>GEN</span>BALLOON</p>
    </div>
</div>


</header>



<main class="order-page">


<section class="order-card">


<h1>
    Završetak porudžbine
</h1>


<div id="order-summary"></div>



<form id="order-form">


<div class="form-group">

<label>
Ime i prezime
</label>

<input 
type="text"
id="name"
placeholder="Unesite ime i prezime"
required>

</div>



<div class="form-group">

<label>
Telefon
</label>

<input 
type="tel"
id="phone"
placeholder="0641234567"
required>

</div>



<div class="form-group">

<label>
Adresa dostave
</label>

<input 
type="text"
id="address"
placeholder="Ulica i broj"
required>

</div>



<div class="form-group">

<label>
Grad
</label>

<input 
type="text"
id="city"
placeholder="Novi Sad"
required>

</div>



<div class="form-group">

<label>
Poštanski broj
</label>

<input 
type="text"
id="postal"
placeholder="21000">

</div>



<div class="form-group">

<label>
Napomena
</label>

<textarea 
id="note"
placeholder="Dodatna napomena">
</textarea>

</div>



<button class="submit-order">

POTVRDI PORUDŽBINU

</button>


</form>


</section>



</main>



<div class="success-modal" id="successModal">


<div class="success-box">


<h2>
Hvala na porudžbini!
</h2>


<p id="order-number"></p>


<p>
Naši zaposleni će potvrditi porudžbinu i kontaktirati vas uskoro.
</p>


<button onclick="window.location.href='index.html'">
NAZAD NA POČETNU
</button>


</div>


</div>



</body>
</html>
