<!DOCTYPE html>
<html lang="sr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Dodaj proizvod</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="styles/admin-add-product.css">



</head>


<body>


<main class="admin-container">


<h1>
    Dodaj novi proizvod
</h1>



<section class="product-card">


<!-- IMAGES -->

<h2>Fotografije proizvoda</h2>


<div class="image-upload-area" id="uploadArea">

    <input 
        type="file" 
        id="productImages"
        accept="image/*"
        multiple
    >

    <div class="upload-content">

        <div class="plus">
            +
        </div>

        <p>
            Dodaj fotografije
        </p>

        <span>
            JPG, PNG, WEBP
        </span>

    </div>

</div>


<div class="image-preview" id="imagePreview"></div>

<div class="image-url-box">

    <label>
        Ili dodajte sliku preko linka
    </label>


    <div class="image-url-row">

        <input 
            type="url"
            id="imageUrl"
            placeholder="https://example.com/slika.jpg"
        >


        <button 
            type="button"
            id="addImageUrl">

            Dodaj

        </button>

    </div>

</div>





<!-- CATEGORY -->


<h2>Kategorija</h2>


<div class="category-buttons">


<button 
class="category-btn active"
data-category="baloni">

Baloni

</button>


<button 
class="category-btn"
data-category="pokloni">

Pokloni

</button>

<button
class="category-btn"
data-category="cvece">

Cveće

</button>


</div>



<div 
class="subcategory-box"
id="subcategoryBox">


<h3>Vrsta balona</h3>


<div class="subcategory-buttons">


<button class="subcategory-btn active">Lateks</button>


<button class="subcategory-btn">U obliku</button>


<button class="subcategory-btn">Brojevi</button>


</div>


</div>






<!-- FORM -->


<div class="form-grid">


<div class="form-group">

<label>
Naziv proizvoda (SR)
</label>

<input 
type="text"
placeholder="Unesite naziv">

</div>



<div class="form-group">

<label>
Naziv proizvoda (RU)
</label>

<input 
type="text"
placeholder="Введите название">

</div>





<div class="form-group full">


<label>
Opis proizvoda (SR)
</label>


<textarea
placeholder="Opis proizvoda">
</textarea>


</div>





<div class="form-group full">


<label>
Opis proizvoda (RU)
</label>


<textarea
placeholder="Описание товара">
</textarea>


</div>





<div class="form-group">

<label>
Cena (din)
</label>

<input 
type="number"
placeholder="0">

</div>




<div class="form-group">

<label>
Stara cena (din)
</label>

<input 
type="number"
placeholder="0">

</div>




<div class="form-group">

<label>
Količina
</label>

<input 
type="number"
value="0">

</div>



<div class="form-group">

<label>
Slug
</label>

<input 
type="text"
placeholder="gold-balloon">

</div>


</div>






<div class="switches">


<label>
<input type="checkbox" checked>
Aktivan proizvod
</label>



<label>
<input type="checkbox">
Istaknuti proizvod
</label>


</div>






<button class="save-btn">

Sačuvaj proizvod

</button>



</section>


</main>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/admin-add-product.js"></script>


</body>
</html>
